name: macOS smoke

# Runs cade end to end on a GitHub Mac (Apple Silicon), with the real
# models: nobody on the project has a Mac, so this is what stands for a
# user trying it (#53). Started by hand; it downloads ~2 GB of models
# (cached between runs) and writes the timings to the run summary.

on:
  workflow_dispatch:
  # Also when a pull request changes this workflow, since a manual run
  # needs the file on the default branch first.
  pull_request:
    paths: [".github/workflows/smoke-macos.yml"]

permissions:
  contents: read

env:
  LLAMA_NATIVE: "OFF"

jobs:
  smoke:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install the llama.cpp build tools
        run: brew install ninja

      - name: Cache the models
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cade/models
          key: models-${{ hashFiles('internal/devtasks/models.go') }}

      - name: Build and download the models
        run: |
          go tool mage cpu
          go tool mage models
          ./bin/cade version

      - name: Ingest and ask, on Metal and on the CPU
        run: |
          # --config, not XDG_CONFIG_HOME: on macOS the default config is
          # under ~/Library/Application Support (os.UserConfigDir).
          # Only the CPU answer is checked: GitHub's Macs are VMs whose
          # virtual GPU makes Metal produce garbage (seen on 2026-10-11),
          # so the Metal run is timed, not trusted.
          for layers in 0 -1; do
            dir="$RUNNER_TEMP/run$layers"; mkdir -p "$dir"
            printf '{"database_path": "%s/cade.db", "embedding": {"gpu_layers": %s}, "generation": {"gpu_layers": %s}}\n' "$dir" "$layers" "$layers" > "$dir/config.json"
            ./bin/cade --config "$dir/config.json" ingest file docs
            start=$(date +%s)
            ./bin/cade --config "$dir/config.json" ask "como compilar o cade no FreeBSD?" | tee "$dir/answer.txt"
            echo "gpu_layers $layers: ask in $(( $(date +%s) - start )) s" | tee -a "$RUNNER_TEMP/timings.txt"
          done
          grep -q "Cited sources:" "$RUNNER_TEMP/run0/answer.txt" || { echo "the CPU answer cites no source"; exit 1; }
          ./bin/cade --config "$RUNNER_TEMP/run0/config.json" doctor || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### macOS smoke"
            echo '```'
            ./bin/cade version
            cat "$RUNNER_TEMP/timings.txt" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
