name: Release

# Pushing a tag vX.Y.Z on a master commit builds one archive per system
# and publishes a GitHub release with them, their SHA-256 and
# docs/release-notes/vX.Y.Z.md as notes. Releases come from master only:
# a tag on a dev commit fails here and publishes nothing. The macOS
# archive (Apple Silicon, Metal, #53) and the Windows one (x86-64, CPU,
# a zip, #54) are experimental: nobody on the project has either system,
# and they are only tested here and in CI.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Portable llama.cpp build (AVX2, FMA, F16C on x86-64): the binary runs
  # on any CPU of its kind from the last decade, not only the runner's.
  LLAMA_NATIVE: "OFF"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on master
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "tag ${GITHUB_REF_NAME} is on $GITHUB_SHA, which is not on master; merge into master and tag there"
            exit 1
          }

      - name: Require release notes
        run: test -s "docs/release-notes/${GITHUB_REF_NAME}.md" || { echo "missing docs/release-notes/${GITHUB_REF_NAME}.md"; exit 1; }

  build:
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            tools: sudo apt-get update && sudo apt-get install -y ninja-build
            shell: bash
          - runner: macos-14
            tools: brew install ninja
            shell: bash
          # MSYS2's UCRT64 brings gcc, cmake, ninja and sqlite3.h (below).
          - runner: windows-latest
            tools: "true"
            shell: msys2 {0}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sqlite3

      - name: Install the llama.cpp build tools
        run: ${{ matrix.tools }}

      - name: Test
        run: go tool mage test

      - name: Build the archive
        run: VERSION="${GITHUB_REF_NAME}" go tool mage dist

      - name: Check the binary reports the tag
        # Not tee /dev/stderr: MSYS2 has none.
        run: |
          version=$(./bin/cade version)
          echo "$version"
          grep -q "cade ${GITHUB_REF_NAME} (" <<< "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.runner }}
          path: |
            dist/*.tar.gz*
            dist/*.zip*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --title "cade ${GITHUB_REF_NAME}"
          --notes-file "docs/release-notes/${GITHUB_REF_NAME}.md"
          dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.zip dist/*.zip.sha256
