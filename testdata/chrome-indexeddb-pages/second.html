<html><head><meta charset="utf-8"></head><body><script>
const req = indexedDB.open("Teams:replychain-manager:fixture");
req.onsuccess = () => {
  const tx = req.result.transaction(["replychains", "people"], "readwrite");
  tx.objectStore("replychains").put({ id: "19:late@thread.v2", note: "gravado na segunda sessão" });
  tx.objectStore("people").delete("8:orgid:0000");
  tx.objectStore("people").put({ displayName: "Bruno" }, "8:orgid:1111");
  tx.oncomplete = () => { document.body.textContent = "DONE2"; };
};
</script></body></html>
