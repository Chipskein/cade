// teams.cloud.microsoft origin. Synthetic content, fictional names.
const suffix = "react-web-client:tenant:user:pt-br";
const at = (iso) => Date.parse(iso);

function openStore(name, store, keyPath) {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(name, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(store, { keyPath });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function putAll(db, store, values) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction([store], "readwrite");
    values.forEach((value) => tx.objectStore(store).put(value));
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
