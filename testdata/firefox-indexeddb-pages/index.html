<html><head><meta charset="utf-8"></head><body><script>
// Synthetic data only: every value type the smclone decoder handles, a

// big enough for Firefox to keep the whole clone in an external file.
const req = indexedDB.open("model-storage-fixture", 1);
req.onupgradeneeded = () => {
  req.result.createObjectStore("message", { keyPath: "id" });
  req.result.createObjectStore("contact");
};
req.onsuccess = () => {
  const db = req.result;
  const tx = db.transaction(["message", "contact"], "readwrite");
  const shared = { tag: "compartilhado" };
  const bytes = new Uint8Array([1, 2, 3, 4, 5, 6, 7, 8]);
  const messages = tx.objectStore("message");
  messages.put({ id: "false_5500000000001@c.us_AAAA", from: "5500000000001@c.us", t: 1727280000, type: "chat",
    body: "Olá, revisão do PR às 15h? ção ✓", emoji: "🎉", props: shared, again: shared,
    author: { user: "5500000000002", server: "c.us", _serialized: "5500000000002@c.us" },
    when: new Date(Date.UTC(2026, 8, 25, 15)), tags: ["a", "b", 3], sparse: (() => { const a = []; a[5] = "x"; return a; })(),
    lookup: new Map([["k1", 1], ["k2", "v"]]), uniq: new Set([1, 2]), big: 12345678901234567890n, negative: -7,
    ratio: 0.5, nothing: null, undef: undefined, flag: true, pattern: /ab+c/gi,
    view: bytes.subarray(2, 6), buffer: bytes.buffer, attachment: new Blob(["conteúdo"], { type: "text/plain" }) });
  messages.put({ id: "true_5500000000001@c.us_BBBB", from: "5500000000001@c.us", t: 1727283600, type: "chat",
    payload: Array.from({ length: 300000 }, (_, i) => (i * 2654435761 % 4294967296).toString(36)).join("") + "fim" });
  tx.objectStore("contact").put({ id: "5500000000002@c.us", name: "Ana Souza", pushname: "Ana" }, "5500000000002@c.us");
  tx.oncomplete = () => { document.title = "DONE"; document.body.textContent = "DONE"; };

};
</script></body></html>
